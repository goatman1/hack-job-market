[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hack-job-market"
version = "0.1.0"
description = "Evidence-backed hiring-manager research for Codex"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastmcp>=3.0,<4",
  "pydantic>=2.11,<3",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "linkedin-research-agent-mcp @ git+https://github.com/raaaaaif/linkedin-research-agent-mcp.git@89567b06b350ca9b17f5878e87141a79dc7d15ea",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
job-market = "job_market.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_market"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
